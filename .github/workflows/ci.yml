name: CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FleetManager/FleetManager.Tests/FleetManager.Tests.csproj

      - name: Test with coverage
        run: |
          dotnet test FleetManager/FleetManager.Tests/FleetManager.Tests.csproj \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory FleetManager/TestResults

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: FleetManager/TestResults/**/coverage.cobertura.xml
          targetdir: FleetManager/TestResults/Report
          reporttypes: MarkdownSummaryGithub;TextSummary
          classfilters: -FleetManager.Migrations.*;-Microsoft.*;-System.*

      - name: Add coverage summary to job
        run: cat FleetManager/TestResults/Report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: FleetManager/TestResults/Report/
          retention-days: 14

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: |
          dotnet publish FleetManager/FleetManager/FleetManager.csproj \
            --configuration Release \
            --output ./publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: fleet-manager-${{ github.sha }}
          path: ./publish/
          retention-days: 30
